<script>
  // ---- Spotlight que sigue el mouse ----
  (function () {
    const spotlight = document.getElementById('mouse-spotlight');
    if (!spotlight || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    window.addEventListener('mousemove', (e) => {
      spotlight.style.setProperty('--x', e.clientX + 'px');
      spotlight.style.setProperty('--y', e.clientY + 'px');
    }, { passive: true });
  })();

  // ---- Fondo de constelación interactivo (canvas, requestAnimationFrame) ----
  (function () {
    const canvas = document.getElementById('constellation-canvas');
    if (!canvas) return;
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion) return; // se deja el canvas vacío/transparente, no penaliza nada

    const ctx = canvas.getContext('2d');
    let w, h, particles, mouse = { x: null, y: null };

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }

    function makeParticles() {
      const count = Math.min(70, Math.floor((w * h) / 22000));
      particles = Array.from({ length: count }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.25,
        vy: (Math.random() - 0.5) * 0.25,
      }));
    }

    function tick() {
      ctx.clearRect(0, 0, w, h);
      const linkDist = 130;

      particles.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > w) p.vx *= -1;
        if (p.y < 0 || p.y > h) p.vy *= -1;

        // atracción muy sutil hacia el mouse
        if (mouse.x !== null) {
          const dx = mouse.x - p.x, dy = mouse.y - p.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 160) {
            p.x += dx * 0.0018;
            p.y += dy * 0.0018;
          }
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, 1.4, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,255,255,0.55)';
        ctx.fill();
      });

      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const a = particles[i], b = particles[j];
          const dx = a.x - b.x, dy = a.y - b.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < linkDist) {
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.strokeStyle = `rgba(255,140,0,${0.12 * (1 - dist / linkDist)})`;
            ctx.lineWidth = 1;
            ctx.stroke();
          }
        }
      }

      requestAnimationFrame(tick);
    }

    window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; }, { passive: true });
    window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });
    window.addEventListener('resize', () => { resize(); makeParticles(); });

    resize();
    makeParticles();
    tick();
  })();

  // ---- Rastro de partículas del cursor (estela luciérnaga, lerp) ----
  (function () {
    const cyanDot = document.getElementById('trail-cyan');
    const orangeDot = document.getElementById('trail-orange');
    if (!cyanDot || !orangeDot || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    if (window.matchMedia('(pointer: coarse)').matches) return; // sin cursor real (touch), no aplica

    let mouseX = -100, mouseY = -100;
    let cyanX = -100, cyanY = -100;
    let orangeX = -100, orangeY = -100;
    let active = false;

    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX; mouseY = e.clientY;
      if (!active) { active = true; cyanDot.style.opacity = '0.9'; orangeDot.style.opacity = '0.6'; }
    }, { passive: true });

    function lerp(a, b, n) { return a + (b - a) * n; }

    function animateTrail() {
      cyanX = lerp(cyanX, mouseX, 0.35);
      cyanY = lerp(cyanY, mouseY, 0.35);
      orangeX = lerp(orangeX, mouseX, 0.15);
      orangeY = lerp(orangeY, mouseY, 0.15);
      cyanDot.style.transform = `translate(${cyanX - 3.5}px, ${cyanY - 3.5}px)`;
      orangeDot.style.transform = `translate(${orangeX - 2.5}px, ${orangeY - 2.5}px)`;
      requestAnimationFrame(animateTrail);
    }
    requestAnimationFrame(animateTrail);
  })();

  // ---- Parallax en blobs de fondo (usa la propiedad CSS 'translate', independiente de 'transform',
  // para no pisar las clases de posicionamiento -translate-x/y-* que ya tienen estos elementos) ----
  (function () {
    const blobs = document.querySelectorAll('.parallax-blob');
    if (!blobs.length || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    let ticking = false;
    function updateParallax() {
      const scrollY = window.scrollY;
      blobs.forEach(blob => {
        const speed = parseFloat(blob.dataset.speed || '0.1');
        blob.style.translate = `0 ${scrollY * speed}px`;
      });
      ticking = false;
    }
    window.addEventListener('scroll', () => {
      if (!ticking) { requestAnimationFrame(updateParallax); ticking = true; }
    }, { passive: true });
    updateParallax();
  })();

  // ---- Búsqueda global (Cmd+K / Ctrl+K) ----
  (function () {
    const SEARCH_INDEX = [
      { title: 'Inicio', desc: 'Página principal de F&V AI Group.', url: 'index.html', cat: 'Pagina' },
      { title: 'Servicios', desc: 'Seis etapas, un mismo equipo, de la asesoría al soporte.', url: 'servicios.html', cat: 'Pagina' },
      { title: 'Asesoría Estratégica', desc: 'Diagnóstico antes de comprometer presupuesto en ejecución.', url: 'asesoria-estrategica.html', cat: 'Servicio' },
      { title: 'Evaluación de Procesos', desc: 'Auditoría técnica y financiera de sus procesos actuales.', url: 'evaluacion-procesos.html', cat: 'Servicio' },
      { title: 'Despliegue y Ejecución', desc: 'Implementación en Dynamics 365 Sales/Customer Service, Odoo Community, Hexágono o desarrollo a medida.', url: 'despliegue-ejecucion.html', cat: 'Servicio' },
      { title: 'Habilitación de Equipos', desc: 'Formación práctica sobre el sistema real de su empresa.', url: 'habilitacion-equipos.html', cat: 'Servicio' },
      { title: 'Masterclasses y Workshops', desc: 'Formación estructurada en gestión empresarial e IA aplicada.', url: 'masterclasses-workshops.html', cat: 'Servicio' },
      { title: 'Acompañamiento Continuo', desc: 'Mantenimiento evolutivo y soporte después del go-live.', url: 'acompanamiento-continuo.html', cat: 'Servicio' },
      { title: 'Cursos', desc: 'Catálogo de masterclasses y workshops presenciales.', url: 'cursos.html', cat: 'Pagina' },
      { title: 'Finanzas con IA', desc: 'Curso presencial: automatice la conciliación de pagos de su empresa.', url: 'curso-finanzas-ia.html', cat: 'Curso' },
      { title: 'Precios', desc: 'Valores de referencia por servicio.', url: 'precios.html', cat: 'Pagina' },
      { title: 'Nosotros', desc: 'Cómo trabajamos y por qué elegir a F&V.', url: 'nosotros.html', cat: 'Pagina' },
      { title: 'Contacto', desc: 'Escríbanos por WhatsApp o el formulario.', url: 'contacto.html', cat: 'Pagina' },
      { title: 'Política de Privacidad', desc: 'Cómo protegemos su información.', url: 'privacidad.html', cat: 'Legal' },
      { title: 'Términos y Condiciones', desc: 'Condiciones de uso del sitio y contratación.', url: 'terminos.html', cat: 'Legal' },
    ];

    const overlay = document.getElementById('search-overlay');
    const input = document.getElementById('search-input');
    const resultsEl = document.getElementById('search-results');
    if (!overlay || !input || !resultsEl) return;

    let activeIndex = -1;
    let currentResults = [];

    function render(list) {
      currentResults = list;
      activeIndex = list.length ? 0 : -1;
      if (!list.length) {
        resultsEl.innerHTML = '<div id="search-empty">Sin resultados. <a href="contacto.html" class="link-underline text-fv-cyan">Escríbanos</a> y le ayudamos directo.</div>';
        return;
      }
      resultsEl.innerHTML = list.map((r, i) => `
        <a href="${r.url}" class="search-result${i === 0 ? ' is-active' : ''}" data-i="${i}">
          <span class="sr-title">${r.title} <span class="sr-tag cat-${r.cat}">${r.cat}</span></span>
          <span class="sr-desc">${r.desc}</span>
        </a>
      `).join('');
    }

    function filterResults(q) {
      const norm = q.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
      if (!norm) return SEARCH_INDEX;
      return SEARCH_INDEX.filter(r => {
        const hay = (r.title + ' ' + r.desc).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        return hay.includes(norm);
      });
    }

    function setActive(i) {
      const items = resultsEl.querySelectorAll('.search-result');
      items.forEach(el => el.classList.remove('is-active'));
      if (items[i]) { items[i].classList.add('is-active'); items[i].scrollIntoView({ block: 'nearest' }); }
      activeIndex = i;
    }

    function openSearch() {
      overlay.classList.add('is-open');
      input.value = '';
      render(SEARCH_INDEX);
      setTimeout(() => input.focus(), 30);
    }
    function closeSearch() {
      overlay.classList.remove('is-open');
    }

    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        overlay.classList.contains('is-open') ? closeSearch() : openSearch();
      }
      if (!overlay.classList.contains('is-open')) return;
      if (e.key === 'Escape') closeSearch();
      if (e.key === 'ArrowDown') { e.preventDefault(); setActive(Math.min(activeIndex + 1, currentResults.length - 1)); }
      if (e.key === 'ArrowUp') { e.preventDefault(); setActive(Math.max(activeIndex - 1, 0)); }
      if (e.key === 'Enter' && currentResults[activeIndex]) { window.location.href = currentResults[activeIndex].url; }
    });

    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeSearch(); });
    input.addEventListener('input', () => render(filterResults(input.value)));
    resultsEl.addEventListener('mouseover', (e) => {
      const el = e.target.closest('.search-result');
      if (el) setActive(parseInt(el.dataset.i, 10));
    });

    const trigger = document.getElementById('search-trigger');
    if (trigger) trigger.addEventListener('click', openSearch);
  })();
</script>

  /* ---- Búsqueda global (Cmd+K / Ctrl+K) ---- */
  #search-trigger {
