<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada | F&V AI Group</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/logo-mark.png">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          head: ['"Space Grotesk"', 'sans-serif'],
          sans: ['Inter', 'sans-serif'],
        },
        colors: {
          fv: {
            black: '#000000', surface: '#0D0E12', border: '#1F232B',
            cyan: '#00FFFF', cyanMid: '#00CCFF',
            orange: '#FF8C00', orangeWarm: '#FF4500',
          }
        }
      }
    }
  }

  // ---- Spotlight que sigue el mouse ----
  (function () {
    const spotlight = document.getElementById('mouse-spotlight');
    if (!spotlight || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    window.addEventListener('mousemove', (e) => {
      spotlight.style.setProperty('--x', e.clientX + 'px');
      spotlight.style.setProperty('--y', e.clientY + 'px');
    }, { passive: true });
  })();

  // ---- Fondo de constelación interactivo (canvas, requestAnimationFrame) ----
  (function () {
    const canvas = document.getElementById('constellation-canvas');
    if (!canvas) return;
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion) return; // se deja el canvas vacío/transparente, no penaliza nada

    const ctx = canvas.getContext('2d');
    let w, h, particles, mouse = { x: null, y: null };

    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }

    function makeParticles() {
      const count = Math.min(70, Math.floor((w * h) / 22000));
      particles = Array.from({ length: count }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.25,
        vy: (Math.random() - 0.5) * 0.25,
      }));
    }

    function tick() {
      ctx.clearRect(0, 0, w, h);
      const linkDist = 130;

      particles.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > w) p.vx *= -1;
        if (p.y < 0 || p.y > h) p.vy *= -1;

        // atracción muy sutil hacia el mouse
        if (mouse.x !== null) {
          const dx = mouse.x - p.x, dy = mouse.y - p.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 160) {
            p.x += dx * 0.0018;
            p.y += dy * 0.0018;
          }
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, 1.4, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,255,255,0.55)';
        ctx.fill();
      });

      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const a = particles[i], b = particles[j];
          const dx = a.x - b.x, dy = a.y - b.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < linkDist) {
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.strokeStyle = `rgba(255,140,0,${0.12 * (1 - dist / linkDist)})`;
            ctx.lineWidth = 1;
            ctx.stroke();
          }
        }
      }

      requestAnimationFrame(tick);
    }

    window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; }, { passive: true });
    window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });
    window.addEventListener('resize', () => { resize(); makeParticles(); });

    resize();
    makeParticles();
    tick();
  })();

  // ---- Rastro de partículas del cursor (estela luciérnaga, lerp) ----
  (function () {
    const cyanDot = document.getElementById('trail-cyan');
    const orangeDot = document.getElementById('trail-orange');
    if (!cyanDot || !orangeDot || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    if (window.matchMedia('(pointer: coarse)').matches) return; // sin cursor real (touch), no aplica

    let mouseX = -100, mouseY = -100;
    let cyanX = -100, cyanY = -100;
    let orangeX = -100, orangeY = -100;
    let active = false;

    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX; mouseY = e.clientY;
      if (!active) { active = true; cyanDot.style.opacity = '0.9'; orangeDot.style.opacity = '0.6'; }
    }, { passive: true });

    function lerp(a, b, n) { return a + (b - a) * n; }

    function animateTrail() {
      cyanX = lerp(cyanX, mouseX, 0.35);
      cyanY = lerp(cyanY, mouseY, 0.35);
      orangeX = lerp(orangeX, mouseX, 0.15);
      orangeY = lerp(orangeY, mouseY, 0.15);
      cyanDot.style.transform = `translate(${cyanX - 3.5}px, ${cyanY - 3.5}px)`;
      orangeDot.style.transform = `translate(${orangeX - 2.5}px, ${orangeY - 2.5}px)`;
      requestAnimationFrame(animateTrail);
    }
    requestAnimationFrame(animateTrail);
  })();

  // ---- Botones magnéticos: se acercan levemente al cursor antes del hover real ----
  (function () {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    if (window.matchMedia('(pointer: coarse)').matches) return;

    const magneticEls = document.querySelectorAll('.btn-primary, .btn-secondary');
    if (!magneticEls.length) return;
    const radius = 70; // px de radio de atracción más allá del propio botón
    magneticEls.forEach(btn => { btn.style.transition = 'transform .2s ease-out'; });

    // Un solo listener para todos los botones (evita apilar N listeners idénticos)
    document.addEventListener('mousemove', (e) => {
      magneticEls.forEach(btn => {
        const rect = btn.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const dx = e.clientX - cx;
        const dy = e.clientY - cy;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const maxDist = Math.max(rect.width, rect.height) / 2 + radius;

        if (dist < maxDist) {
          const pull = (1 - dist / maxDist) * 0.35;
          btn.style.transform = `translate(${dx * pull}px, ${dy * pull}px)`;
        } else {
          btn.style.transform = 'translate(0, 0)';
        }
      });
    }, { passive: true });
  })();

  // ---- Parallax en blobs de fondo (usa la propiedad CSS 'translate', independiente de 'transform',
  // para no pisar las clases de posicionamiento -translate-x/y-* que ya tienen estos elementos) ----
  (function () {
    const blobs = document.querySelectorAll('.parallax-blob');
    if (!blobs.length || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    let ticking = false;
    function updateParallax() {
      const scrollY = window.scrollY;
      blobs.forEach(blob => {
        const speed = parseFloat(blob.dataset.speed || '0.1');
        blob.style.translate = `0 ${scrollY * speed}px`;
      });
      ticking = false;
    }
    window.addEventListener('scroll', () => {
      if (!ticking) { requestAnimationFrame(updateParallax); ticking = true; }
    }, { passive: true });
    updateParallax();
  })();

  // ---- Efecto de "dibujo" en subrayados degradados al entrar en pantalla ----
  (function () {
    const underlineEls = document.querySelectorAll('.link-underline');
    if (!underlineEls.length || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    const drawObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        const el = entry.target;
        el.style.transition = 'background-size 0.8s ease';
        el.style.backgroundSize = '100% 1.5px';
        setTimeout(() => {
          el.style.backgroundSize = '';
          el.style.transition = '';
        }, 1100);
        drawObserver.unobserve(el);
      });
    }, { threshold: 0.8 });

    underlineEls.forEach(el => drawObserver.observe(el));
  })();
</script>
<style>
  html { background: #000; } body { background: #000; }
  .grain { background-image: radial-gradient(#ffffff08 1px, transparent 1px); background-size: 28px 28px; }
  .btn-primary { background-color: #FF8C00; color: #000; box-shadow: 0 0 10px #FF8C00, 0 0 26px #FF4500, 0 0 50px rgba(255,69,0,0.3); transition: transform .25s ease, box-shadow .25s ease, filter .25s ease; }
  .btn-primary:hover { filter: brightness(1.1); transform: scale(1.04); }
  .btn-primary:active { transform: scale(0.95); filter: brightness(0.98); transition: transform .1s ease; }
  .btn-secondary { background-color: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); color: #fff; transition: transform .25s ease, box-shadow .25s ease, background-color .25s ease, border-color .25s ease; }
  .btn-secondary:hover { background-color: rgba(0,204,255,0.08); border-color: rgba(0,255,255,0.5); transform: scale(1.04); }
  .btn-secondary:active { transform: scale(0.95); transition: transform .1s ease; }
  @keyframes hexspin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }
  .hex-spin { animation: hexspin 40s linear infinite; }
  @keyframes floaty { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-10px);} }
  .float { animation: floaty 6s ease-in-out infinite; }
  .link-underline { background-image: linear-gradient(90deg, #00FFFF, #FF8C00); background-size: 0% 1.5px; background-position: left bottom; background-repeat: no-repeat; transition: background-size .3s ease; }
  .link-underline:hover { background-size: 100% 1.5px; }

  /* ---- Spotlight que sigue el mouse ---- */
  #mouse-spotlight {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(600px circle at var(--x, 50%) var(--y, 50%), rgba(0,204,255,0.06), transparent 40%);
    transition: background .1s ease-out;
  }

  /* ---- Fondo de constelación (canvas) ---- */
  #constellation-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.5; }

  /* ---- Rastro de partículas del cursor (estela luciérnaga) ---- */
  .firefly-trail-dot {
    position: fixed; top: 0; left: 0; z-index: 55; pointer-events: none;
    border-radius: 9999px; will-change: transform, opacity;
  }
  #trail-cyan { width: 7px; height: 7px; background: #00FFFF; box-shadow: 0 0 8px #00FFFF, 0 0 14px rgba(0,255,255,0.6); }
  #trail-orange { width: 5px; height: 5px; background: #FF8C00; box-shadow: 0 0 8px #FF8C00, 0 0 14px rgba(255,140,0,0.6); }
</style>
</head>
<body class="bg-fv-black text-slate-300 font-sans antialiased min-h-screen flex items-center justify-center relative overflow-hidden px-6">

<div id="trail-orange" class="firefly-trail-dot" style="opacity:0;"></div>

<canvas id="constellation-canvas"></canvas>

<div id="mouse-spotlight"></div>
